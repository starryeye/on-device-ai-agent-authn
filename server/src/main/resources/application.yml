server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/agent-identity;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

# 이 프로젝트의 실험 손잡이. 값의 뜻과 각 손잡이가 무엇을 증명하는지는 server/README.md 와
# 설계 문서(docs/superpowers/specs/2026-08-27-agent-identity-registration-design.md §5.4)를
# 참고한다. 이 블록이 없으면 PolicyProperties.allowedPackages 가 빈 목록으로 남아
# RegistrationPolicy 가 앱 신원 검사를 건너뛴다 — 위협 모델이 막는다고 주장하는 바로 그
# 우회가 배포된 서버에서 열려 있게 된다.
agent-registration:
  require-security-level: TRUSTED_ENVIRONMENT
  require-verified-boot: true
  require-device-locked: true
  allowed-packages: [dev.starryeye.ondeviceagent]
  require-device-binding: false
  require-play-integrity: false
  agent-product-id: galaxy-personal-agent
  identifier-namespace: samsung
  challenge-ttl: 5m
  credential-ttl: 15m
  max-attestation-age: 7d
  max-pending-challenges: 10000
